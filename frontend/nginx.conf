# nginx server for the gemba front end. The Dockerfile copies this over
# /etc/nginx/conf.d/default.conf, so it is included inside the image's `http {}` block.
# The unprivileged image runs as a non-root user and listens on 8080.

# Every header is added once, at server level. nginx drops inherited add_header lines in any
# location that declares its own, so per-path values come from these maps instead.

# Angular names its build output with a content hash (main-33JCA5AP.js, chunk-D_Zj6Btw.js), so
# those files can be cached for a year. index.html and unhashed files (favicon.ico) are
# revalidated on every load, so a new deploy is picked up at once. The backend sets its own
# caching for /api/ and /actuator/.
map $uri $gemba_cache_control {
    ~^/(api|actuator)/  "";
    "~-[A-Za-z0-9_]{8}\.(js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$"  "public, max-age=31536000, immutable";
    default             "no-cache";
}

# CSP for the app itself. Responses from the backend (including Swagger UI at /api/docs) carry
# whatever policy the backend sets, so this one isn't stamped on them.
#   default-src 'self'      scripts, fetches, images, and fonts come only from this origin.
#   style-src  'self' 'unsafe-inline'  Angular compiles each component's styles into the JS
#                           bundle and adds them as <style> elements at runtime, which 'self'
#                           alone blocks. A hash can't cover them (the _ngcontent ids are filled
#                           in at runtime), and a nonce would need nginx to rewrite index.html on
#                           every request. Scripts stay 'self' only, so injected markup still
#                           can't run code. [style.x] bindings use the CSSOM, which CSP allows.
#   frame-ancestors 'none'  the app can't be framed (clickjacking).
map $uri $gemba_csp {
    ~^/(api|actuator)/  "";
    default             "default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Keep the scheme the browser used (cloudflared sends X-Forwarded-Proto: https).
map $http_x_forwarded_proto $gemba_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Because proxy_pass below uses a variable, `backend` is looked up per
    # request instead of at startup, so nginx starts (and serves the app) even when the backend
    # container is down or doesn't exist yet. /api/ calls then get a 502 until it's up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gemba_backend http://backend:8080;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json
               application/problem+json image/svg+xml;

    add_header Cache-Control $gemba_cache_control;
    add_header Content-Security-Policy $gemba_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # The container's own liveness check (Compose healthcheck). Answered by nginx alone, so the
    # front end reports healthy even while the backend is down.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Angular routes (/partners/SIMUSR0142, /tasks?task=48213) all serve index.html.
    location / {
        try_files $uri /index.html;
    }

    # A missing file with an extension is a real 404, not index.html served as JavaScript
    # (which happens after a deploy when an old tab asks for a chunk that no longer exists).
    location ~* \.(js|mjs|css|map|ico|png|jpe?g|gif|svg|webp|avif|woff2?|txt|json|webmanifest)$ {
        try_files $uri =404;
    }

    # The API, on the same origin as the app. With a variable and no URI part, proxy_pass sends
    # the request path unchanged (/api/partners?q=... stays /api/partners?q=...).
    # ^~ stops the regex location above from catching API paths that end in .json or .css
    # (/api/docs/swagger-ui.css) and answering them with a 404.
    location ^~ /api/ {
        proxy_pass $gemba_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gemba_forwarded_proto;
    }

    location = /actuator/health {
        proxy_pass $gemba_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gemba_forwarded_proto;
    }

    # Only the health endpoint is public; other actuator paths aren't exposed through here.
    location ^~ /actuator/ {
        return 404;
    }
}
