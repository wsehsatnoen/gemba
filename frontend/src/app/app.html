<button type="button" class="skip-link" (click)="skipToContent()">Skip to content</button>
<g-top-bar />
<main #main id="main" tabindex="-1">
  @if (metaService.meta()) {
    <router-outlet />
  } @else if (metaService.error(); as problem) {
    <g-state status="error" [problem]="problem" (retry)="metaService.load()" />
  } @else {
    <g-state status="loading" />
  }
</main>
