# gemba on the Raspberry Pi (ARM64). CI builds and pushes the images to GHCR; the Pi only pulls:
#   docker compose pull && docker compose up -d
#
# The Cloudflare Tunnel points at the frontend container (http://frontend:8080 from a cloudflared
# container on this network, or http://localhost:8080 from cloudflared on the host). nginx serves
# the app and proxies /api/ and /actuator/health to the backend, so the browser sees one origin.
#
# The backend service isn't defined here yet. nginx expects it to be named `backend` and to listen
# on port 8080 on this Compose network; until it exists, the app loads and /api/ calls return 502.

services:
  frontend:
    image: ghcr.io/wsehsatnoen/gemba-frontend:latest
    restart: unless-stopped
    # Loopback only: the tunnel is the public way in. The backend needs no published port, since
    # nginx reaches it over the Compose network.
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      # Answered by nginx itself, so it reflects the front end only, not the backend.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
